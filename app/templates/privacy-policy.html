<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Policy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-md-10">

        {% if item %}
        <div class="card border-0 shadow-sm rounded-4">

          <!-- Header -->
          <div class="card-header bg-white border-bottom px-4 py-3 rounded-top-4">
            <div class="d-flex align-items-center gap-2">
              <div style="width:4px;height:26px;background:#7d1d27;border-radius:4px;flex-shrink:0;"></div>
              <i class="fa-solid fa-shield-halved" style="color:#7d1d27;"></i>
              <h5 class="mb-0 fw-bold" style="color:#0f172a;">
                {{ item.p_title|default:"Privacy Policy" }}
              </h5>
            </div>
          </div>

          <!-- Body -->
          <div class="card-body px-4 py-4">
            <div style="font-size:14.5px;color:#334155;line-height:1.9;">
              {{ item.p_text|safe }}
            </div>
          </div>

        </div>

        {% else %}
        <div class="card border-0 shadow-sm rounded-4 text-center py-5">
          <div class="card-body">
            <i class="fa-solid fa-shield-halved mb-3 d-block" style="font-size:48px;color:#e2e8f0;"></i>
            <p class="text-muted mb-0">No privacy policy added yet.</p>
          </div>
        </div>
        {% endif %}

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

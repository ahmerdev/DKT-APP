<div style="font-family:Arial,sans-serif;max-width:480px;margin:auto;padding:24px">
  <h2 style="margin:0 0 12px">{{ title }}</h2>
  <p style="color:#555">{% if name %}Hi {{ name }},<br>{% endif %}Your verification code:</p>
  <div style="font-size:32px;letter-spacing:8px;font-weight:bold;background:#f4f4f4;
              padding:16px;text-align:center;border-radius:8px">{{ code }}</div>
  <p style="color:#888;font-size:13px;margin-top:16px">
    This code expires in {{ minutes }} minutes. If you did not request it, please ignore this email.
  </p>
</div>

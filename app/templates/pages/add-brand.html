{% extends 'dashboard.html' %}
{% load static %}
{% block title %}brand | Add-brand{% endblock %}
{% block content %}

<div class="main-content-inner">
    <!-- main-content-wrap -->
    <div class="main-content-wrap">
        <div class="flex items-center flex-wrap justify-between gap20 mb-27">
            <h3>Add Brands</h3>
            <ul class="breadcrumbs flex items-center flex-wrap justify-start gap10">
                <li>
                    <a href="#">
                        <div class="text-tiny">Dashboard</div>
                    </a>
                </li>
                <li>
                    <i class="icon-chevron-right"></i>
                </li>
                <li>
                    <a href="#">
                        <div class="text-tiny">Brands</div>
                    </a>
                </li>
                <li>
                    <i class="icon-chevron-right"></i>
                </li>
                <li>
                    <div class="text-tiny">New brand</div>
                </li>
            </ul>
        </div>
        <!-- new-category -->
        <div class="wg-box">
           <form class="form-new-product form-style-1" action="" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <fieldset class="name">
        <div class="body-title">brand Name <span class="tf-color-1">*</span></div>
        <input class="flex-grow" type="text" id="productName" placeholder="brand name" name="name"
               tabindex="0" value="{{ form.name.value|default_if_none:'' }}" aria-required="true" required="">
    </fieldset>

    <fieldset class="name">
        <div class="body-title">brand Slug <span class="tf-color-1">*</span></div>
        <input class="flex-grow" type="text" id="productSlug" placeholder="brand Slug" name="slug"
               tabindex="0" value="{{ form.slug.value|default_if_none:'' }}" aria-required="true" required="">
    </fieldset>

    <fieldset>
                    <div class="body-title">Upload Image <span class="tf-color-1">*</span></div>

 
                    <div id="brandImgPreview" 
                        style="{% if brand and brand.image %}display:block{% else %}display:none{% endif %};
                                position:relative; width:160px; height:160px; margin-bottom:12px;">
                        <img id="brandPreviewImg"
                            src="{% if brand and brand.image %}{{ brand.image.url }}{% else %}{% endif %}"
                            style="width:100%; height:100%; object-fit:cover; border-radius:10px; border:2px solid #e2e8f0;">
                         <button type="button" class="remove-btn" onclick="brandRemoveImage()">×</button>
                    </div>

                    <div id="brandUploadZone"  class="item up-load"
                        onclick="mpOpen('single','brand_main')"
                        style="{% if brand and brand.image %}display:none{% else %}display:block{% endif %};
                                cursor:pointer; padding:32px; text-align:center;
                                border:2px dashed #cbd5e1; border-radius:10px;">
                    <label class="uploadfile" for="myFile">
                    <span class="icon"><i class="icon-upload-cloud"></i></span>
                    <span class="body-text">Drop your images here or select <span class="tf-color">click to browse</span></span>
                    </div>

                    <input type="hidden" name="image_lib_id" id="brandImageLibId" value="">
                    <input type="hidden" name="remove_image"  id="brandRemoveFlag"  value="">
            </fieldset>

    <div class="bot">
        <div></div>
        <button class="tf-button w208" type="submit">{% if category %}Update{% else %}Save{% endif %}</button>
    </div>
</form>

        </div>
    </div>
</div>
<script>
// function to slugify text
function slugify(text) {
    return text
        .toString()
        .toLowerCase()
        .trim()
        .replace(/&/g, '-and-')         
        .replace(/[\s\W-]+/g, '-')      
        .replace(/^-+|-+$/g, '');     
}

// auto update slug when typing in product name
document.getElementById("productName").addEventListener("input", function() {
    let name = this.value;
    let slug = slugify(name);
    document.getElementById("productSlug").value = slug;
});
document.addEventListener('DOMContentLoaded', function(){

  // Modal se image select hone par yeh chalega
  window.MP_HANDLERS['brand_main'] = function(mediaId, url){
    document.getElementById('brandPreviewImg').src            = url;
    document.getElementById('brandImgPreview').style.display  = 'block';
    document.getElementById('brandUploadZone').style.display  = 'none';
    document.getElementById('brandImageLibId').value          = mediaId;
    document.getElementById('brandRemoveFlag').value          = '';
  };

});

// X button — image hatao
function brandRemoveImage(){
  document.getElementById('brandPreviewImg').src            = '';
  document.getElementById('brandImgPreview').style.display  = 'none';
  document.getElementById('brandUploadZone').style.display  = 'block';
  document.getElementById('brandImageLibId').value          = '';
  document.getElementById('brandRemoveFlag').value          = '1';
}
</script>
{% endblock %}

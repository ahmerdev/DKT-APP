{% extends 'dashboard.html' %}
{% load static %}
{% block title %}Banner | Add-Banner{% endblock %}
{% block content %}

<div class="main-content-inner">
    <!-- main-content-wrap -->
    <div class="main-content-wrap">
        <div class="flex items-center flex-wrap justify-between gap20 mb-27">
            <h3>Add Banners</h3>
            <ul class="breadcrumbs flex items-center flex-wrap justify-start gap10">
                <li>
                    <a href="#">
                        <div class="text-tiny">Dashboard</div>
                    </a>
                </li>
                <li>
                    <i class="icon-chevron-right"></i>
                </li>
                <li>
                    <a href="#">
                        <div class="text-tiny">Banners</div>
                    </a>
                </li>
                <li>
                    <i class="icon-chevron-right"></i>
                </li>
                <li>
                    <div class="text-tiny">Add New Banner</div>
                </li>
            </ul>
        </div>
        <!-- new-category -->
        <div class="wg-box">
           <form class="form-new-product form-style-1" action="" method="POST" enctype="multipart/form-data">
                            {% csrf_token %}
                                    <div class="gap22 cols">
                                            <fieldset class="category">
                                                <div class="body-title mb-10">Category <span class="tf-color-1">*</span>
                                                </div>
                                                 <div class="select">
                                                    <!-- Category -->
                                                        <select class="form-multi-select" name="category" multiple data-coreui-search="true">
                                                            <option value="">Choose category</option>
                                                            {% for category in categories %}
                                                                <option value="{{ category.id }}"
                                                                    {% if banner and category in banner.category.all %}selected{% endif %}>
                                                                    {{ category.name }}
                                                                </option>
                                                            {% endfor %}
                                                        </select>
                                                    </div>
                                            </fieldset>
                                            <fieldset class="brand">
                                                <div class="body-title mb-10">Brand <span class="tf-color-1">*</span>
                                                </div>
                                                 <div class="select">
                                                        <!-- Brand -->
                                                     <select class="form-multi-select" name="brand" multiple data-coreui-search="true">
                                                        <option value="">Choose Brand</option>
                                                        {% for brand in brands %}
                                                            <option value="{{ brand.id }}"
                                                                {% if banner and brand in banner.brand.all %}selected{% endif %}>
                                                                {{ brand.name }}
                                                            </option>
                                                        {% endfor %}
                                                    </select>
                                                    </div>
                                            </fieldset>
                                        </div>

                                            <fieldset>
                    <div class="body-title">Upload Image <span class="tf-color-1">*</span></div>

 
                    <div id="bannerImgPreview" 
                        style="{% if banner and banner.image %}display:block{% else %}display:none{% endif %};
                                position:relative; width:160px; height:160px; margin-bottom:12px;">
                        <img id="bannerPreviewImg"
                            src="{% if banner and banner.image %}{{ banner.image.url }}{% else %}{% endif %}"
                            style="width:100%; height:100%; object-fit:cover; border-radius:10px; border:2px solid #e2e8f0;">
                         <button type="button" class="remove-btn" onclick="bannerRemoveImage()">×</button>
                    </div>

                    <div id="bannerUploadZone"  class="item up-load"
                        onclick="mpOpen('single','banner_main')"
                        style="{% if banner and banner.image %}display:none{% else %}display:block{% endif %};
                                cursor:pointer; padding:32px; text-align:center;
                                border:2px dashed #cbd5e1; border-radius:10px;">
                    <label class="uploadfile" for="myFile">
                    <span class="icon"><i class="icon-upload-cloud"></i></span>
                    <span class="body-text">Drop your images here or select <span class="tf-color">click to browse</span></span>
                    </div>

                    <input type="hidden" name="image_lib_id" id="bannerImageLibId" value="">
                    <input type="hidden" name="remove_image"  id="bannerRemoveFlag"  value="">
            </fieldset>

                                            <div class="bot">
                                                <div></div>
                                                <button class="tf-button w208" type="submit">{% if banner %}Update{% else %}Save{% endif %}</button>
                                            </div>
                                        </form>

        </div>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function(){

  window.MP_HANDLERS['banner_main'] = function(mediaId, url){
    document.getElementById('bannerPreviewImg').src            = url;
    document.getElementById('bannerImgPreview').style.display  = 'block';
    document.getElementById('bannerUploadZone').style.display  = 'none';
    document.getElementById('bannerImageLibId').value          = mediaId;
    document.getElementById('bannerRemoveFlag').value          = '';
  };

});


function bannerRemoveImage(){
  document.getElementById('bannerPreviewImg').src            = '';
  document.getElementById('bannerImgPreview').style.display  = 'none';
  document.getElementById('bannerUploadZone').style.display  = 'block';
  document.getElementById('bannerImageLibId').value          = '';
  document.getElementById('bannerRemoveFlag').value          = '1';
}
</script>
{% endblock %}

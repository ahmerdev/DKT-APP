{% extends 'dashboard.html' %}
{% load static %}
{% block title %} about | Add-about{% endblock %}
{% block content %}

<div class="main-content-inner">
    <!-- main-content-wrap -->
    <div class="main-content-wrap">
        <div class="flex items-center flex-wrap justify-between gap20 mb-27">
            <h3>Add About Us</h3>
            <ul class="breadcrumbs flex items-center flex-wrap justify-start gap10">
                <li>
                    <a href="#">
                        <div class="text-tiny">Dashboard</div>
                    </a>
                </li>
                <li>
                    <i class="icon-chevron-right"></i>
                </li>
                <li>
                    <a href="#">
                        <div class="text-tiny">About Us</div>
                    </a>
                </li>
            </ul>
        </div>
        <!-- new-category -->
        <div class="wg-box">
           <form class="form-new-product form-style-1" action="" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                    <fieldset class="name">
                        <div class="body-title">About Title <span class="tf-color-1">*</span></div>
                        <input class="flex-grow" type="text" placeholder="Title" name="title"
                            tabindex="0" value="{{ form.title.value|default_if_none:'' }}" aria-required="true" required="">
                    </fieldset>
                        <fieldset class="description">
                            <div class="body-title mb-10">About Us Content<span class="tf-color-1"></span>
                            </div>
                            <textarea id="about-text" name="text">{{ about.text|default_if_none:'' }}</textarea>
                    </fieldset>
            </div>
    
    <div class="bot">
        <div></div>
        <button class="tf-button w208" type="submit">{% if about %}Update{% else %}Save{% endif %}</button>
    </div>
</form>

        </div>
    </div>
</div>
</script>
{% endblock %}

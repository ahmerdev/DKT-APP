<div class="modal-header">
    <h5 class="modal-title">Available Riders - {{ city.name }}</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body">

<div class="table-responsive card-body shadow">
  <table class="table table-hover align-middle">
    <thead class="table-head text-white text-center">
      <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>Email</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody>
      {% for rider in riders %}
      <tr>
        <td class="text-center">{{ rider.name }}</td>
        <td class="text-center">{{ rider.phone }}</td>
        <td class="text-center">{{ rider.email }}</td>

        <td class="text-center">
          <a href="{% url 'assign_rider' order.id rider.id %}" 
             class="btn btn-success btn-sm">
             Assign
          </a>
        </td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="4" class="text-center text-muted">
          No riders in this city
        </td>
      </tr>
      {% endfor %}
    </tbody>

  </table>
</div>

</div>

<div class="modal-footer">
    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">
        Close
    </button>
</div>

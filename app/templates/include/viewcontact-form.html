<div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content rounded-5 shadow-lg">
      
      <!-- Header -->
      <div class="modal-header border-0 bg-danger text-white rounded-5">
        <h5 class="modal-title fs-3 text-white"><i class="fa-solid fa-address-card me-2 text-white"></i>Contact Details</h5>
      </div>

      <!-- Body -->
      <div class="modal-body p-5 bg-light">
        <div id="contact-doc" class="p-4 rounded-4 shadow-sm bg-white">
          
          <!-- First & Last Name -->
          <div class="row mb-3">
            <div class="col-md-6 mb-2">
                <div class="f_name bg-warning rounded-5 p-5 shadow">
                    <span class="fw-bold text-black"><i class="fa-solid fa-user me-1"></i>First Name:</span>
              <span id="modal_first_name" class="fs-4 text-dark"></span>
                </div>
            </div>
            <div class="col-md-6">
               <div class="l_name bg-warning rounded-5 p-5 shadow">  
              <span class="fw-bold text-black"><i class="fa-solid fa-user me-1"></i>Last Name:</span>
              <span id="modal_last_name" class="fs-4 text-dark"></span>
            </div>
            </div>
          </div>

          <!-- Email & Phone -->
          <div class="row mb-3">
            <div class="col-md-6 mb-2">
            <div class="mail bg-warning rounded-5 p-5 shadow"> 
              <span class="fw-bold text-black"><i class="fa-solid fa-envelope me-1"></i>Email:</span>
              <span id="modal_email" class="fs-4 text-dark"></span>
            </div>
            </div>
            <div class="col-md-6">
            <div class="phone bg-warning rounded-5 p-5 shadow"> 
              <span class="fw-bold text-black"><i class="fa-solid fa-phone me-1"></i>Phone:</span>
              <span id="modal_phone" class="fs-4 text-dark"></span>
            </div>
            </div>
          </div>

          <!-- Message -->
          <div class="mb-3 bg-warning rounded-5 p-5 shadow">
            <span class="fw-bold text-black"><i class="fa-solid fa-comment me-1"></i>Message:</span>
            <div id="modal_message" class="fs-4 text-dark mt-2 p-3" style="max-height:150px; overflow-y:auto;"></div>
          </div>

        </div>
      </div>

      <!-- Footer -->
      <div class="modal-footer border-0 justify-content-center bg-light pt-0">
        <button type="button" class="btn btn-danger btn-lg px-5 shadow" data-bs-dismiss="modal">
          <i class="fa-solid fa-xmark me-2"></i>Close
        </button>
      </div>

    </div>
  </div>
</div>

<style>
/* Extra styling for modern look */

.modal-body {
    background: #f7f9fc;
}
.modal-content {
    border: none;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function () {
    var modal = document.getElementById('staticBackdrop');

    modal.addEventListener('show.bs.modal', function (event) {
        var button = event.relatedTarget;
        var contactId = button.getAttribute('data-id');

        fetch(`/get-contactform/${contactId}/`)   // <-- corrected URL
            .then(res => res.json())
            .then(data => {
                if(!data.error){
                    document.getElementById('modal_first_name').textContent = data.first_name;
                    document.getElementById('modal_last_name').textContent = data.last_name;
                    document.getElementById('modal_email').textContent = data.email;
                    document.getElementById('modal_phone').textContent = data.phone;
                    document.getElementById('modal_message').textContent = data.message;
                } else {
                    document.getElementById('contact-doc').innerHTML = `<p class="text-center text-muted">${data.error}</p>`;
                }
            });
    });
});

</script>

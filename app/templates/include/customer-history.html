<div class="table-responsive card-body p-0">
    <table  class="table table-hover no-border align-middle">
        <thead class="table-head text-white">
            <tr>
                <th class="text-center text-white">Image</th>
                <th class="text-center text-white">Item Name</th>
                <th class="text-center text-white">Quantity</th>
                 <th class="text-center text-white">Points</th>
                <th class="text-center text-white">Price</th>
            </tr>
        </thead>
        <tbody id="user-table-body">
            {% for item in entry.items %}
            <tr>
                <td class="text-center">
                    {% if item.image %}
                        <img src="{{ item.image.url }}" alt="{{ item.name }}" width="50" class="rounded">
                    {% else %}
                        <span class="text-muted">No Image</span>
                    {% endif %}
                </td>
                <td class="text-center">{{ item.name }}</td>
                <td class="text-center">{{ item.quantity }}</td>
                 <td class="text-center"><span class="badge bg-danger fs-5">{{ item.pts }}</span></td>
                <td class="text-center">
                    {% if item.price > 0 %}
                        Rs {{ item.price }}
                    {% else %}
                        Redeem
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
            <tr style="background:#f8fafc; font-weight:700;">
            <td colspan="4" class="text-end">
                <i class="fa-solid fa-calculator"></i> Grand Total
            </td>
            <td class="text-center">
                <span class="price-val">
                    <i class="fas fa-rupee-sign" style="font-size:11px;"></i>
                    {{ total_amount }}
                </span>
            </td>
        </tr>
        </tbody>
    </table>
</div>
